version: 2

models:
  - name: fct_sales
    description: "جدول الحقائق لعمليات المبيعات في المتجر"
    columns:
      - name: order_id
        description: "معرف الطلب الفريد"
        tests:
          - unique
          - not_null
      - name: sales_amount
        description: "قيمة المبيعات للطلب"
        tests:
          - not_null

  - name: dim_customers
    description: "جدول الأبعاد الخاص بالعملاء"
    columns:
      - name: customer_id
        description: "معرف العميل الفريد"
        tests:
          - unique
          - not_null